
<!-- Modal -->
<div class="modal fade" id="editStationModal" tabindex="-1" aria-labelledby="editStationLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-sm">
        <form id="editStationForm">
          {% csrf_token %}
          <div class="modal-header border-bottom">
            <div>
              <h5 class="modal-title fw-bold" id="editStationLabel">Edit Radio Station</h5>
              <small class="text-muted">Update the radio station details</small>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
  
          <div class="modal-body">
            <input type="hidden" id="stationSlug">
  
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Station Name *</label>
                <input type="text" class="form-control" id="stationName" name="name" value="{{ station.station.name }}" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Market *</label>
                <select class="form-select" id="stationMarket" name="market" required>
                  <option value="">Select Market</option>
                  {% for market in station.markets %}
                    <option value="{{ market.uuid }}" 
                      {% if station.station.market and market.uuid == station.station.market.uuid %}
                        selected
                      {% endif %}>
                      {{ market.name }}
                    </option>
                  {% endfor %}
                </select>
              </div>
              


              <div class="col-md-6">
                <label class="form-label">Owner *</label>
                <input type="text" class="form-control" id="stationOwner" name="owner" value="{{ station.station.owner }}" required>
              </div>

                <div class="col-md-6">
                <label class="form-label">Format *</label>
                <select class="form-select" id="stationFormat" name="format" required>
                    <option value="">Select Format</option>
                    {% for r in station.formats %}
                    <option value="{{ r.uuid }}" {%if r.uuid == station.station.format.uuid %}selected{% endif %}>{{ r.name }}</option>
                    {% endfor %}
                  </select>
              </div>
  
              <div class="col-md-6">
                <label class="form-label">Station Group *</label>
                <input type="text" class="form-control" id="stationGroup" name="station_group" required value="{{ station_group }}">
              </div>
  
              <div class="col-md-6">
                <label class="form-label">REP *</label>
                <select class="form-select" id="stationRep" name="rep" required>
                  <option value="">Select REP</option>
                  {% for r in station.rep %}
                  <option value="{{ r.uuid }}" {%if r.uuid == station.station.rep.uuid %}selected{% endif %}>{{ r.name }}</option>
                  {% endfor %}
                </select>
              </div>
  
              <div class="col-md-12">
                <label class="form-label">Assign User *</label>
                <select class="form-select" id="stationAssignUser" name="assign_user" required>
                  <option value="">Select User</option>
                  {% for u in station.users %}
                  <option value="{{ u.id }}" {%if u.id == station.station.assign_user.id %}selected{% endif %}>{{ u.name }}</option>
                  {% endfor %}

                  {% comment %} {% for r in station.formats %}
                  <option value="{{ r.uuid }}" {%if r.uuid == station.station.format.uuid %}selected{% endif %}>{{ r.name }}</option>
                  {% endfor %} {% endcomment %}


                </select>
              </div>
  
              <div class="col-md-12">
                <label class="form-label">Description</label>
                <textarea class="form-control" id="stationDescription" name="description" rows="3">{{ station.station.description }}</textarea>
              </div>
            </div>
          </div>
  
          <div class="modal-footer border-top">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-pencil-square"></i> Update Station
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
